name: Semantic Release and Build

on:
  push:
    branches:
      - main  # Запускаем только при пуше в main

permissions:
  contents: write  # Разрешаем создавать коммиты, теги и релизы

jobs:
  # Job 1: Определение новой версии, создание тега и GitHub-релиза
  release:
    name: Create Release
    runs-on: ubuntu-latest
    concurrency: release
    outputs:
      # Передаем новый тег в следующий job
      new_tag: ${{ steps.semantic.outputs.new_release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно: скачиваем всю историю коммитов и тегов
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Сборка артефактов для нового релиза
  build:
    name: Build Artifacts
    needs: release  # Ждем завершения job'а release
    if: needs.release.outputs.new_tag != ''  # Запускаем только если был создан новый тег
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: CraftHelper.exe
            asset_path: dist/CraftHelper.exe
          - os: ubuntu-latest
            artifact_name: CraftHelper
            asset_path: dist/CraftHelper
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_tag }}  # Чекаутимся на созданный тег

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --console --name CraftHelper \
            --add-data "assets/recipes.txt;assets" \
            --add-data "assets/easy_ingredients.txt;assets" \
            --collect-all customtkinter \
            --collect-all PIL \
            --hidden-import models \
            --hidden-import calculator \
            --hidden-import dialogs \
            --hidden-import gui \
            --hidden-import database \
            --hidden-import parser \
            --hidden-import resources \
            main.py
        shell: bash

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.new_tag }}
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}