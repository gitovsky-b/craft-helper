# .github/workflows/build.yml
name: Semantic Release and Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.semantic.outputs.tag }}      # <-- правильный output
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Artifacts
    needs: release
    if: needs.release.outputs.new_tag != ''           # тег гарантированно будет
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: CraftHelper.exe
            asset_path: dist/CraftHelper.exe
          - os: ubuntu-latest
            artifact_name: CraftHelper
            asset_path: dist/CraftHelper
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --console --name CraftHelper \
            --add-data "assets/recipes.txt;assets" \
            --add-data "assets/easy_ingredients.txt;assets" \
            --collect-all customtkinter \
            --collect-all PIL \
            --hidden-import models \
            --hidden-import calculator \
            --hidden-import dialogs \
            --hidden-import gui \
            --hidden-import database \
            --hidden-import parser \
            --hidden-import resources \
            main.py
        shell: bash

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.new_tag }}
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}